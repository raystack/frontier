name: web-sdk

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout v7.0.1 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm 10 with pnpm/action-setup v5.0.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.19.0

      - name: Setup Node.js 22.x with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Install npm 11
        run: npm install -g npm@11.21.2

      - name: Install Dependencies 🔧
        run: pnpm i --frozen-lockfile

      - name: Build Step 🔧
        env:
          CI: ""
        run: npm run ci:build

      - name: Bump Package Version
        run: npm run bump-version
        working-directory: ./web/sdk
        env:
          GIT_REFNAME: ${{ github.ref_name }}

      - name: Run Semantic Release 🚀
        run: npm run release:ci
        working-directory: ./web/sdk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
