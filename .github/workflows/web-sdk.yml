name: web-sdk

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-sdk-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pack.outputs.version }}
      dist-tag: ${{ steps.pack.outputs.dist-tag }}
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout v7.0.1 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup pnpm 10 with pnpm/action-setup v5.0.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.19.0

      - name: Setup Node.js 22.x with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Install Dependencies 🔧
        run: pnpm i --frozen-lockfile

      - name: Build Step 🔧
        env:
          CI: ""
        run: npm run ci:build

      - name: Bump Package Version
        run: npm run bump-version
        working-directory: ./web/sdk
        env:
          GIT_REFNAME: ${{ github.ref_name }}

      - name: Check Version Matches Tag
        run: test "$(node -p 'require("./package.json").version')" = "${GIT_REFNAME#v}"
        working-directory: ./web/sdk
        env:
          GIT_REFNAME: ${{ github.ref_name }}

      - name: Pack Tarball 📦
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/sdk"
          npm pack --pack-destination "$RUNNER_TEMP/sdk"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$(node scripts/dist-tag.js)" >> "$GITHUB_OUTPUT"
        working-directory: ./web/sdk

      - name: Upload Tarball with actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-sdk-tarball
          path: ${{ runner.temp }}/sdk/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup Node.js 24.22.2 (npm 11.19.1) with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
          package-manager-cache: false

      - name: Download Tarball with actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: web-sdk-tarball
          path: ${{ runner.temp }}/sdk

      - name: Show npm Version
        run: npm --version

      - name: Publish to npm 🚀
        run: npm publish "$RUNNER_TEMP/sdk/raystack-frontier-$VERSION.tgz" --tag "$DIST_TAG"
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
